<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Novak Sport Stringing Cards</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
            }

            body {
                background-color: #f0f0f0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }

            .toolbar {
                width: 21cm;
                padding: 0.35cm 0;
                display: flex;
                justify-content: flex-end;
            }

            .print-button {
                border: 0;
                background: #111;
                color: #fff;
                padding: 8px 14px;
                font-size: 10pt;
                font-weight: bold;
                cursor: pointer;
            }

            .print-button:hover {
                background: #333;
            }

            .page {
                width: 21cm;
                height: 29.7cm;
                background: white;
                padding-top: 0.35cm; /* Center vertically on A4 */
                display: grid;
                grid-template-columns: repeat(2, 10.5cm);
                grid-template-rows: repeat(2, 14.5cm);
            }

            .card {
                width: 10.5cm;
                height: 14.5cm;
                border: 1px dashed #ccc; /* Cut line */
                padding: 0.6cm;
                display: flex;
                flex-direction: column;
                background: #fff;
                gap: 0.25cm;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.2cm;
            }

            .logo-text {
                font-weight: 900;
                font-size: 14pt;
                line-height: 1;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .logo-icon {
                font-size: 22pt;
                font-weight: 900;
                font-style: italic;
                letter-spacing: -2px;
            }

            .logo-image {
                display: block;
                width: auto;
                height: 0.9cm;
                max-width: 4.8cm;
                object-fit: contain;
                margin-right: 0.2cm;
            }

            .title {
                font-size: 12pt;
                font-weight: 900;
                text-align: right;
                text-transform: uppercase;
                line-height: 1.1;
            }

            .label {
                font-size: 7.5pt;
                font-weight: bold;
                margin-bottom: 2px;
                text-transform: uppercase;
            }

            .box {
                border: 1px solid #000;
                width: 100%;
            }

            input.box,
            textarea.box {
                display: block;
                border-radius: 0;
                color: #000;
                background: #fff;
                font: inherit;
                padding: 4px;
            }

            input.box:focus,
            textarea.box:focus {
                outline: 2px solid #555;
                outline-offset: -2px;
            }

            .row {
                display: flex;
                gap: 0.4cm;
            }

            .col-left {
                flex: 1.2;
                display: flex;
                flex-direction: column;
            }

            .col-right {
                flex: 0.8;
                display: flex;
                flex-direction: column;
            }

            .simple-box {
                height: 1cm;
            }

            .tension-container {
                border: 1px solid #000;
                display: flex;
                flex-direction: column;
                flex-grow: 1;
            }

            .t-row {
                display: flex;
                flex: 1;
            }

            .t-row:first-child {
                border-bottom: 1px solid #000;
            }

            .t-label {
                width: 45%;
                border-right: 1px solid #000;
                font-size: 7pt;
                font-weight: bold;
                padding: 4px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .t-label span {
                font-size: 5.5pt;
                font-weight: normal;
            }

            .t-input {
                flex: 1;
            }

            .notes-box {
                height: 3.2cm;
                resize: none;
            }
            .price-box {
                height: 0.9cm;
                margin-bottom: 0.2cm;
            }
            .date-box {
                height: 0.9cm;
            }

            /* Footer */
            .footer-section {
                margin-top: auto;
                text-align: center;
            }

            .strung-by-box {
                height: 0.9cm;
            }

            @media print {
                body {
                    background-color: white;
                }
                .toolbar {
                    display: none;
                }
                .page {
                    box-shadow: none;
                }
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <button class="print-button" type="button" onclick="window.print()">Print / Save as PDF</button>
        </div>
        <div class="page">
            <div class="card">

                <div class="header">
                    <div class="logo-text">
                        <img class="logo-image" src="logo.jpg" alt="Novak Sport" />
                        <div>NOVAK<br />SPORT</div>
                    </div>
                    <div class="title">String Service</div>
                </div>

                <div class="row">
                    <div class="col-left">
                        <div class="label">Surname</div>
                        <input class="box simple-box" type="text" aria-label="Surname" />
                    </div>
                    <div class="col-right">
                        <div class="label">Name</div>
                        <input class="box simple-box" type="text" aria-label="Name" />
                    </div>
                </div>

                <div class="row" style="height: 2.2cm">
                    <div class="col-left">
                        <div class="label">String Type</div>
                        <input class="box simple-box" type="text" aria-label="String type" />
                    </div>
                    <div class="col-right">
                        <div class="label">Tension</div>
                        <div class="tension-container">
                            <div class="t-row">
                                <div class="t-label">MAIN</div>
                                <input class="t-input" type="text" aria-label="Main tension" />
                            </div>
                            <div class="t-row">
                                <div class="t-label">CROSS</div>
                                <input class="t-input" type="text" aria-label="Cross tension" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-left">
                        <div class="label">Notes</div>
                        <textarea class="box notes-box" aria-label="Notes"></textarea>
                    </div>
                    <div class="col-right">
                        <div>
                            <div class="label">Price</div>
                            <input class="box price-box" type="text" aria-label="Price" />
                            <!-- TODO: Add euro sign -->
                        </div>
                        <div style="margin-top: auto">
                            <div class="label">Date</div>
                            <input class="box date-box" type="text" aria-label="Date" />
                            <!-- TODO: Add date formatting -->
                        </div>
                    </div>
                </div>

                <div class="footer-section">
                    <div class="label">Strung by:</div>
                    <input class="box strung-by-box" type="text" aria-label="Strung by" />
                </div>
            </div>
        </div>
        <script>
            const page = document.querySelector(".page");
            const cardTemplate = page.querySelector(".card");

            for (let cardNumber = 1; cardNumber < 4; cardNumber += 1) {
                page.appendChild(cardTemplate.cloneNode(true));
            }
        </script>
    </body>
</html>
